name: Node.js CI

on:
  push:
    branches: [master, sho-gha, '#*']
  pull_request:
    branches: [master, sho-gha]

permissions:
  contents: write
  actions: read
  checks: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Security scan - check for secrets
        uses: gitleaks/gitleaks-action@v2
      
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build --parallel

      - name: Security scan by Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cicd_tp:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
      
      - name: Create test-results directory
        run: |
          mkdir -p test-results
          chmod 777 test-results

      - name: Run tests in Docker
        run: docker compose run --rm test

      - name: Run lint in Docker
        run: docker compose run --rm lint

      - name: Test report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: JEST Tests
          path: test-results/*.xml
          reporter: jest-junit

      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy to GitHub Pages
        if: always() && github.ref == 'refs/heads/sho-gha'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          publish_branch: gh-pages

      - name: Comment PR with Allure Report Link
        if: always() && github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          comment_tag: allure-report
          mode: upsert
          message: |
            ### 📊 Allure Test Report (Build #${{ github.run_number }})
            | Item | Status |
            | :--- | :--- |
            | **Result** | ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }} |
            | **Report URL** | [View Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}) |
            
            _Last updated at: $(date +'%Y-%m-%d %H:%M:%S')_

      - name: Tear down compose (cleanup)
        if: always()
        run: docker compose down --volumes --remove-orphans
