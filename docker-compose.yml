services:
  # dev, prod
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cicd_tp:latest
    container_name: cicd_tp
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${PORT:-3000}/hello', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # test
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: cicd_tp-test:latest
    container_name: cicd_tp-test
    environment:
      NODE_ENV: test
      JEST_JUNIT_OUTPUT: /app/test-results/junit.xml
    volumes:
      - ./src:/app/src
      - ./test-results:/app/test-results
      - ./tests:/app/tests
      - ./package.json:/app/package.json
    command: npm run test

  # ESLint
  lint:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: my-project-lint
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./eslint.config.mjs:/app/eslint.config.mjs
      - ./package.json:/app/package.json
    command: npm run lint
